name: Memory Submission
description: Fallback form for proposing a memory when an Agent-authored pull request is not practical.
title: "[Memory] "
labels:
  - memory-submission
body:
  - type: markdown
    attributes:
      value: |
        Agent-authored pull requests are preferred. Before submitting, read `CONTRIBUTING_AGENT.md`. Submitting this form does not publish the memory; a maintainer must review and commit it to the static JSON data.
  - type: input
    id: place-name
    attributes:
      label: Place name / 地点名称
      placeholder: 南京大学苏州校区
    validations:
      required: true
  - type: input
    id: place-reference
    attributes:
      label: Existing place ID or map link / 已有地点 id 或地图链接
      description: Use an existing place ID whenever possible.
      placeholder: nju-suzhou-campus
    validations:
      required: true
  - type: input
    id: coordinates
    attributes:
      label: Coordinates / 坐标
      description: Longitude, latitude, used only to confirm the matching existing place. This workflow does not create a new Place.
      placeholder: 120.387037, 31.351239
    validations:
      required: true
  - type: input
    id: memory-title
    attributes:
      label: Memory title / 标题
      description: Optional. Leave blank and the Agent will generate a grounded title from the submitted images and context.
  - type: textarea
    id: memory-description
    attributes:
      label: Memory / 记忆正文
      description: Optional. Leave blank and the Agent will generate grounded text without inventing people, events, or dates.
  - type: input
    id: occurred-at
    attributes:
      label: When it happened / 发生时间
      placeholder: 2026-11-06 or an honest approximate date
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors in display order / 作者名单（按显示顺序）
      description: Authors have no primary, coauthor, or photographer roles. Separate multiple names with commas.
      placeholder: 周玄渊, 云飞
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Images / 图片
      description: Drag original images into this field. The Agent will convert them to WebP and generate specific alt text.
      placeholder: Upload the original image files here.
    validations:
      required: true
  - type: checkboxes
    id: license-confirmation
    attributes:
      label: Content license / 内容授权确认
      options:
        - label: I own or am authorized to submit this content and agree to the license stated in the repository's media policy.
          required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: Privacy / 隐私确认
      options:
        - label: I have permission from identifiable contributors and have removed private or unsafe location information.
          required: true

